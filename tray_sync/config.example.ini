; Copie para config.ini e preencha. NAO versione o config.ini (tem segredos).

[dbf]
produtos   = F:\DataNet\sacadpro.dbf
; cadastro de agregados da substituicao tributaria (campos CODPRO, UF, AGRESUBST).
; Deixe vazio para NAO somar ICMS-ST ao preco.
agregados  = F:\DataNet\sacadagr.dbf
encoding   = cp850

[tray]
api_base          = https://www.sededasmiudezas.com.br/web_api
consumer_key      =
consumer_secret   =
; usado so se nao houver refresh_token valido
code              =
; acrescimo percentual aplicado sobre o preco (era produtos_parametro.acrescimo)
acrescimo_percent = 0
uf_st             = PE

[sync]
intervalo_segundos   = 60
intervalo_requisicao = 0.4
limite_diario        = 9500
retry_minutos        = 30
remap_minutos        = 60
; False = comportamento identico ao Delphi atual (so o slot 01). Ver README.
st_todos_slots       = false
state_db  = tray_sync.db
log_file  = tray_sync.log
stop_file = parar_sync.txt
